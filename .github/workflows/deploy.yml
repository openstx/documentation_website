name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation_website
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The submodule is pinned to a commit in git, so a plain checkout can
      # lag behind public-specification's main branch. Fast-forward it to the
      # tip of main on every build so the deployed site always reflects the
      # latest published specification content.
      - name: Update specification submodule to latest main
        run: |
          git submodule set-branch --branch main -- specification
          git submodule update --remote --merge specification
          git -C specification log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
